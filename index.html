<!DOCTYPE html>
<html lang="ja" data-theme="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<title>パタパタ時計</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <div id="clock">
    <div class="group"><div class="card"></div><div class="card"></div></div>
    <div class="colon"><i></i><i></i></div>
    <div class="group"><div class="card"></div><div class="card"></div></div>
  </div>
  <div id="label"></div>
</main>

<!-- 長押しで出す日付・天気・気温・風速・秒 -->
<div id="info">
  <div class="row" id="infoDate">--.--</div>
  <div class="row" id="infoWx">天気を取得中</div>
  <div class="row" id="infoSub">風 -- m/s</div>
  <div id="infoNote"></div>
</div>

<div id="icons">
  <button id="btnFs" type="button" aria-label="全画面">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="btnWake" type="button" aria-label="画面消灯防止">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
  </button>
  <button id="btnSnd" type="button" aria-label="効果音">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path class="x" d="M16 10l4 4M20 10l-4 4"/></svg>
  </button>
</div>

<!-- 夜間（22時〜6時）に重ねる暗幕 -->
<div id="night"></div>

<script src="app.js"></script>
</body>
</html>
